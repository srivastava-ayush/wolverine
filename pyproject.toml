[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-engineer"
version = "0.1.0"
description = "Evidence-driven, human-approved GitHub issue repair agent"
requires-python = ">=3.10,<3.14"
dependencies = ["openai>=1.0,<3", "uagents>=0.25.5", "uagents-core>=0.1"]

[project.scripts]
healer = "agents.cli:main"

[tool.setuptools.packages.find]
include = ["agents*", "core*"]
